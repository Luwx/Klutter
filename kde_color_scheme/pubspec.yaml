name: kde_color_scheme
description: "Reads KDE Plasma color schemes, streams changes, and sets custom KWin title bar colors."
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: KdeColorSchemePlugin
