# Run with `dart run ffigen --config ffigen.yaml`.
name: KdeColorSchemeBindings
description: |
  Bindings for `src/kde_color_scheme.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`. If libclang
  cannot find its own headers (e.g. `stddef.h`), add
  `--compiler-opts "-I/usr/lib/clang/<version>/include"`.
output: 'lib/src/kde_color_scheme_bindings_generated.dart'
headers:
  entry-points:
    - 'src/kde_color_scheme.h'
  include-directives:
    - 'src/kde_color_scheme.h'
ffi-native:
comments:
  style: any
  length: full
